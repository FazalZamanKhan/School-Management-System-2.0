name: CI

on:
  push:
    branches:
      - master
      - Improvement
      - Improvement-2
      - 'feature/**'
  pull_request:
    branches:
      - master
      - Improvement
      - Improvement-2

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-test-secret
      DJANGO_SETTINGS_MODULE: config.settings.postgres_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: perfect_foundation
          POSTGRES_USER: school_admin
          POSTGRES_PASSWORD: school_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_admin -d perfect_foundation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: perfect_foundation
          DB_USER: school_admin
          DB_PASSWORD: school_password
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: perfect_foundation
          DB_USER: school_admin
          DB_PASSWORD: school_password
        run: python manage.py test apps
